name: Validate Model
on: [push, pull_request]
 
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Check model registry
        run: python run.py summary
      
      - name: Run training/validation with logs
        run: python run.py validate --model baseline_frozen_encoder --files data/processed/test1.csv 2>&1 | tee training.log
      
      - name: Upload training logs
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: training.log
      
      - name: Upload model info
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: models/baseline_frozen_encoder/metrics.json