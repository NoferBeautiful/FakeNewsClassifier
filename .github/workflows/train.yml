name: Validate Model
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Check model registry
        run: python run.py summary
      
      - name: Upload model info
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: models/baseline_frozen_encoder/metrics.json
